<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Leadership &amp; Social Influence · Skill Application</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");

        :root{
            --bg:#07182D;
            --p1:rgba(255,255,255,.06);
            --p2:rgba(255,255,255,.08);
            --w:#FFFFFF;
            --mu:rgba(255,255,255,.72);
            --cy:#02C8FF;
            --cyl:#8FE6FF;
            --bl:#0A60FF;
            --gr:#8fd86e;
            --yl:#ffcb4d;
            --pk:#FF007F;
            --or:#FF9000;
            --pu:#b48cff;
            --tl2:#59d4b4;
            --lk:#7d90a6;
            --ln:rgba(255,255,255,.16);
            --br:linear-gradient(
                90deg,
                #0A60FF 5%,
                #02C8FF 37%,
                #02C8FF 43%,
                #FF007F 75%,
                #FF9000 94%
            );
        }

        *{box-sizing:border-box}

        html,
        body{
            margin:0;
            padding:0;
            background:transparent;
        }

        body,
        button,
        input,
        textarea,
        select{
            font-family:"Inter",Arial,sans-serif;
            font-weight:400;
        }

        body{
            color:var(--w);
            font-size:16px;
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        h1,h2,h3,h4,h5{font-weight:700}
        b,strong,legend,caption,summary,dt,optgroup,th{font-weight:600}

        button{
            font:inherit;
            cursor:pointer;
        }

        /* =========================================================
           App shell
           ========================================================= */

        #app{
            width:100%;
            max-width:1100px;
            margin:auto;
            padding:28px 24px;
        }

        .shell{
            overflow:hidden;
            background:var(--bg);
            border:1px solid rgba(255,255,255,.12);
            border-radius:12px;
            box-shadow:0 10px 28px rgba(0,0,0,.3);
        }

        .hd{
            padding:28px 48px 0;
        }

        .scrollwrap{
            overflow:visible;
        }

        .stage{
            min-height:450px;
            padding:38px 48px 46px;
        }

        #app.fm{
            width:100%;
            max-width:none;
            min-height:100vh;
            margin:0;
            padding:6px 10px;
        }

        #app.fm .shell{
            min-height:calc(100vh - 12px);
        }

        #app.fm .hd{
            padding:12px 28px 0;
        }

        #app.fm h1{
            font-size:1rem;
        }

        #app.fm .st{
            margin-top:14px;
        }

        #app.fm .stage{
            min-height:0;
            padding:24px 28px 32px;
        }

        #app:fullscreen,
        #app:-webkit-full-screen{
            width:100%;
            max-width:none;
            min-height:100vh;
            margin:0;
            padding:16px;
            background:var(--bg);
        }

        #app:fullscreen .shell,
        #app:-webkit-full-screen .shell{
            min-height:calc(100vh - 32px);
        }

        /* =========================================================
           Header
           ========================================================= */

        .tp{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:14px;
            flex-wrap:wrap;
        }

        h1{
            max-width:620px;
            margin:0;
            color:var(--cy);
            font-size:1.1rem;
            line-height:1.4;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .hbr{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .hb{
            min-height:44px;
            padding:10px 16px;
            color:var(--w);
            background:transparent;
            border:1px solid rgba(255,255,255,.45);
            border-radius:24px;
            font-size:.85rem;
        }

        .hb:hover,
        .bk:hover{
            background:rgba(255,255,255,.1);
        }

        /* Short-version visible instructions panel */

        .inst-panel{
            margin-top:20px;
            padding:20px 24px;
            color:var(--mu);
            background:var(--p1);
            border-left:4px solid var(--cy);
            border-radius:10px;
            font-size:.95rem;
            line-height:1.6;
        }

        .inst-panel h2{
            margin:0 0 10px;
            color:#fff;
            font-size:1.05rem;
        }

        .inst-panel ul{
            margin:0;
            padding-left:22px;
        }

        .inst-panel li{
            margin-bottom:8px;
        }

        .inst-panel li:last-child{
            margin-bottom:0;
        }

        /* =========================================================
           Progress navigation
           ========================================================= */

        .st{
            display:flex;
            flex-wrap:wrap;
            align-items:flex-start;
            gap:8px;
            margin:24px 0 0;
            padding:0;
            list-style:none;
        }

        .st li{
            display:block;
            flex:1 1 94px;
            min-width:94px;
            vertical-align:top;
        }

        .st button{
            display:block;
            width:100%;
            padding:0 2px;
            color:var(--mu);
            background:none;
            border:0;
            text-align:center;
        }

        .sb{
            display:block;
            height:7px;
            margin-bottom:8px;
            background:rgba(255,255,255,.2);
            border-radius:5px;
            transition:background .25s;
        }

        .st li.dn .sb{background:var(--gr)}
        .st li.cu .sb{background:var(--pk)}

        .tlab{
            display:block;
            padding-bottom:6px;
        }

        .tln{
            display:block;
            height:1.34em;
            overflow:hidden;
            font-size:.76rem;
            line-height:1.34;
            white-space:nowrap;
            text-overflow:ellipsis;
        }

        .tgl{
            display:inline-block;
            width:1.15em;
            overflow:hidden;
            font-size:.68rem;
            text-align:left;
            vertical-align:baseline;
        }

        .st li.dn .tgl{color:var(--gr)}

        .st li.cu .tln:not(.e){
            color:#fff;
            text-decoration:underline;
            text-underline-offset:3px;
        }

        .st button:hover .tln{color:#fff}

        .st li.lk button{cursor:not-allowed}

        .st li.lk .tln,
        .st li.lk .tgl{
            color:var(--lk);
        }

        .st li.lk .sb{
            background:rgba(255,255,255,.14);
        }

        .st li.lk button:hover .tln{
            color:var(--lk);
        }

        .mnav{
            display:none;
            margin:20px 0 0;
        }

        .mnav label{
            display:block;
            margin:0 0 6px;
            color:var(--mu);
            font-size:.85rem;
        }

        .mnav select{
            width:100%;
            min-height:46px;
            padding:10px 12px;
            color:#fff;
            background:var(--p2);
            border:1px solid rgba(255,255,255,.32);
            border-radius:7px;
            font-size:.95rem;
        }

        .dv{
            height:1px;
            margin-top:22px;
            background:var(--ln);
        }

        /* =========================================================
           General content
           ========================================================= */

        .pr{
            max-width:880px;
            margin:0 0 22px;
            color:#fff;
            font-size:1.12rem;
            line-height:1.62;
            overflow-wrap:anywhere;
        }

        /* Short-version narrative bridge treatment */

        .brg{
            max-width:880px;
            margin:0 0 22px;
            color:var(--cyl);
            font-size:1.05rem;
            font-weight:600;
            line-height:1.62;
            overflow-wrap:anywhere;
        }

        .sk{
            max-width:880px;
            margin-top:26px;
            padding-top:20px;
            color:#fff;
            border-top:1px solid var(--ln);
            font-size:1.12rem;
            line-height:1.6;
        }

        .cp{
            max-width:880px;
        }

        .cp.sp{
            margin-top:26px;
        }

        .cp p{
            margin:0 0 18px;
            font-size:1rem;
        }

        .cp p:last-child{
            margin-bottom:0;
        }

        .nt{
            max-width:880px;
            margin-top:20px;
            color:var(--mu);
            font-size:.88rem;
        }

        .warn{
            max-width:880px;
            margin-top:16px;
            padding:12px 16px;
            color:var(--w);
            background:rgba(255,203,77,.12);
            border-left:4px solid var(--yl);
            border-radius:8px;
            font-size:.88rem;
        }

        .bn{
            max-width:880px;
            margin:0 0 18px;
            padding:14px 18px;
            color:var(--mu);
            background:rgba(255,255,255,.05);
            border-radius:8px;
            font-size:.88rem;
        }

        .ins{
            display:flex;
            gap:10px;
            max-width:880px;
            margin:0 0 26px;
            padding:16px 20px;
            color:var(--mu);
            background:var(--p1);
            border-radius:9px;
            font-size:.93rem;
            line-height:1.6;
            overflow-wrap:anywhere;
        }

        .obj{
            max-width:880px;
            margin:0 0 22px;
            padding:18px 22px;
            background:var(--p1);
            border-left:4px solid var(--cyl);
            border-radius:10px;
        }

        .obj h3{
            margin:0 0 10px;
            color:var(--cyl);
            font-size:.78rem;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .obj ol{
            margin:0;
            padding-left:22px;
            color:var(--mu);
        }

        .obj li{
            margin-bottom:8px;
            font-size:1rem;
            line-height:1.55;
        }

        .obj li:last-child{
            margin-bottom:0;
        }

        /* =========================================================
           Selection controls
           ========================================================= */

        .rl{
            display:flex;
            flex-wrap:wrap;
            gap:12px;
            max-width:900px;
        }

        .ro{
            min-height:52px;
            padding:12px 21px;
            color:var(--w);
            background:var(--p1);
            border:1px solid rgba(255,255,255,.3);
            border-radius:28px;
            font-size:.95rem;
            text-align:left;
        }

        .ro:hover{
            background:var(--p2);
            border-color:#fff;
        }

        .ro.sel{
            color:#062033;
            background:var(--cy);
            border-color:var(--cy);
        }

        .ch{
            display:grid;
            gap:14px;
            max-width:940px;
        }

        .cb{
            width:100%;
            min-height:56px;
            padding:18px 24px;
            color:#071b2e;
            background:
                linear-gradient(#fff,#fff) padding-box,
                var(--br) border-box;
            border:2px solid transparent;
            border-radius:10px;
            font-size:1rem;
            line-height:1.5;
            text-align:left;
        }

        .cb:hover{
            box-shadow:
                0 0 5px rgba(2,200,255,.9),
                0 0 18px rgba(2,200,255,.4);
        }

        .cb.sel{
            box-shadow:
                0 0 0 3px rgba(2,200,255,.85) inset,
                0 0 15px rgba(2,200,255,.45);
        }

        /* =========================================================
           Short-version feedback cards
           ========================================================= */

        @keyframes slideUpFade{
            0%{
                opacity:0;
                transform:translateY(10px);
            }
            100%{
                opacity:1;
                transform:translateY(0);
            }
        }

        .fb{
            max-width:940px;
            margin-top:20px;
            padding:24px 28px;
            background:rgba(255,255,255,.09);
            border-left:6px solid var(--cy);
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,.2);
            animation:slideUpFade .4s ease-out;
        }

        .fb.confirm{border-left-color:var(--gr)}
        .fb.reconsider{border-left-color:var(--pk)}
        .fb.explore{border-left-color:var(--yl)}

        .fb p{
            margin:0;
            color:#fff;
            font-size:1.05rem;
            line-height:1.6;
            overflow-wrap:anywhere;
        }

        .fb-acts{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:12px;
            margin-top:20px;
            padding-top:16px;
            border-top:1px solid rgba(255,255,255,.1);
        }

        .sr{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:10px;
            margin-top:14px;
        }

        .sl2{
            color:var(--mu);
            font-size:.75rem;
            letter-spacing:.07em;
            text-transform:uppercase;
        }

        .chip{
            padding:5px 12px;
            color:#062033;
            background:var(--cy);
            border-radius:999px;
            font-size:.8rem;
        }

        .sn{
            color:var(--mu);
            font-size:.9rem;
            overflow-wrap:anywhere;
        }

        .rt{
            margin-top:14px !important;
            color:var(--mu) !important;
            font-size:.88rem !important;
        }

        .gh{
            min-height:44px;
            padding:9px 18px;
            color:var(--mu);
            background:transparent;
            border:1px dashed rgba(255,255,255,.5);
            border-radius:8px;
            font-size:.95rem;
        }

        .gh:hover{
            color:#fff;
            border-color:#fff;
        }

        .gh.arm{
            color:var(--yl);
            border-color:var(--yl);
            border-style:solid;
        }

        /* =========================================================
           Skills
           ========================================================= */

        .le{
            max-width:940px;
            margin-top:16px;
            padding:16px 20px;
            background:var(--p1);
            border-left:4px solid var(--cyl);
            border-radius:10px;
            font-size:1rem;
            line-height:1.6;
        }

        .leh{
            display:block;
            margin-bottom:6px;
            color:var(--cyl);
            font-size:.78rem;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .led{
            color:var(--mu);
        }

        .skx{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:10px 26px;
            max-width:940px;
            margin:0 0 22px;
            padding-bottom:16px;
            border-bottom:1px solid var(--ln);
        }

        .skg{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:8px;
        }

        .skx .lbl{
            color:var(--mu);
            font-size:.74rem;
            letter-spacing:.07em;
            text-transform:uppercase;
        }

        .tag{
            padding:4px 11px;
            color:var(--w);
            background:rgba(255,255,255,.09);
            border:1px solid rgba(255,255,255,.22);
            border-radius:999px;
            font-size:.78rem;
        }

        .tag.pri{
            color:#062033;
            background:var(--cyl);
            border-color:var(--cyl);
        }

        /* =========================================================
           Scenario and typed-response cards
           ========================================================= */

        .pn,
        .bg,
        .au,
        .mine,
        .nx,
        .tl,
        .rh,
        .ph,
        .cm,
        .rs,
        .af,
        .ob,
        .pfw{
            overflow-wrap:anywhere;
        }

        .pn{
            max-width:940px;
            margin:0 0 22px;
            padding:22px 26px;
            background:var(--p1);
            border-radius:10px;
        }

        .pn h3{
            margin:0 0 14px;
            color:#fff;
            font-size:.84rem;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .pn p{
            margin:0 0 14px;
            font-size:1rem;
            line-height:1.6;
        }

        .pn p:last-child{
            margin-bottom:0;
        }

        .bg{
            max-width:940px;
            margin-top:24px;
            padding:20px 24px;
            background:var(--p1);
            border-left:4px solid var(--yl);
            border-radius:10px;
        }

        .bg b{
            display:block;
            margin-bottom:6px;
            color:var(--yl);
            font-size:1.05rem;
        }

        .bg p{
            max-width:880px;
            margin:0 0 18px;
            color:#fff;
            font-size:1rem;
            line-height:1.55;
        }

        .bg p:last-child{
            margin-bottom:0;
        }

        .au{
            max-width:940px;
            margin:0 0 24px;
            padding:22px 26px;
            background:var(--p1);
            border-left:4px solid var(--yl);
            border-radius:10px;
        }

        .au h3,
        .nx h3{
            margin:0 0 8px;
            color:#fff;
            font-size:1rem;
        }

        .au p.aui,
        .nx p.aui{
            margin:0 0 14px;
            color:var(--mu);
            font-size:.93rem;
            line-height:1.6;
        }

        .au .cnt{
            margin:8px 0 0;
            color:var(--mu);
            font-size:.88rem;
        }

        .mine{
            max-width:940px;
            margin:0 0 22px;
            padding:18px 22px;
            background:rgba(255,255,255,.05);
            border-left:4px solid var(--yl);
            border-radius:10px;
        }

        .mine .mh{
            display:block;
            margin-bottom:8px;
            color:var(--yl);
            font-size:.78rem;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .mine .mq{
            margin:0;
            font-size:1rem;
            line-height:1.6;
        }

        .nx{
            max-width:940px;
            margin-top:20px;
            padding:20px 24px;
            background:var(--p1);
            border-left:4px solid var(--gr);
            border-radius:10px;
        }

        /* =========================================================
           Navigation
           ========================================================= */

        .nv{
            display:flex;
            flex-wrap:wrap;
            justify-content:space-between;
            gap:15px;
            max-width:940px;
            margin-top:32px;
            padding-top:24px;
            border-top:1px solid var(--ln);
        }

        .nr{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:14px;
        }

        .bk,
        .co{
            min-height:48px;
            padding:11px 22px;
            border-radius:8px;
            font-size:.95rem;
            font-weight:600;
        }

        .bk{
            color:var(--w);
            background:transparent;
            border:1px solid rgba(255,255,255,.42);
        }

        .co{
            color:#062033;
            background:
                linear-gradient(var(--cy),var(--cy)) padding-box,
                var(--br) border-box;
            border:2px solid transparent;
        }

        .co.off{
            opacity:.45;
            cursor:not-allowed;
        }

        .hn{
            max-width:300px;
            color:var(--mu);
            font-size:.9rem;
            overflow-wrap:anywhere;
        }

        /* =========================================================
           Diagnostic tables
           ========================================================= */

        table.mx{
            width:100%;
            max-width:1000px;
            margin:0 0 24px;
            border-collapse:collapse;
        }

        table.mx caption{
            padding-bottom:14px;
            color:var(--mu);
            font-size:.9rem;
            text-align:left;
        }

        table.mx th,
        table.mx td{
            border:1px solid var(--ln);
        }

        table.mx thead th{
            padding:13px 9px;
            color:#fff;
            background:var(--p1);
            font-size:.86rem;
            line-height:1.35;
            vertical-align:top;
        }

        .chs{
            display:block;
            margin-top:3px;
            color:var(--mu);
            font-size:.76rem;
        }

        table.mx th.sg{
            width:44%;
            padding:16px;
            color:#fff;
            background:rgba(255,255,255,.04);
            font-size:.96rem;
            line-height:1.55;
            text-align:left;
        }

        table.px th.sg{
            width:46%;
        }

        table.mx td{
            padding:10px 8px;
            text-align:center;
        }

        table.px td{
            padding:8px;
        }

        .ml{
            display:none;
        }

        td.fc{
            padding:0 !important;
        }

        td.fc .fb{
            max-width:none;
            margin:0;
            border-radius:0;
        }

        .rd{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            min-height:46px;
            padding:0 8px;
            margin:0;
            cursor:pointer;
            border-radius:7px;
        }

        .rd:hover{
            background:rgba(255,255,255,.06);
        }

        .rd input{
            position:absolute;
            width:1px;
            height:1px;
            margin:-1px;
            padding:0;
            overflow:hidden;
            clip:rect(0,0,0,0);
            border:0;
        }

        .dot{
            display:inline-block;
            flex:0 0 auto;
            width:22px;
            height:22px;
            background:transparent;
            border:2px solid rgba(255,255,255,.55);
            border-radius:50%;
            transition:background .2s,border-color .2s;
        }

        .rd:hover .dot{
            border-color:var(--cy);
        }

        .rd input:checked + .dot{
            background:var(--cy);
            border-color:var(--cy);
        }

        .rd input:focus-visible + .dot{
            outline:3px solid var(--yl);
            outline-offset:3px;
        }

        .tl{
            max-width:940px;
            margin-bottom:24px;
            padding:20px 24px;
            background:var(--p1);
            border-radius:10px;
        }

        .tl h3{
            margin:0 0 12px;
            color:#fff;
            font-size:.82rem;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .tr{
            display:flex;
            justify-content:space-between;
            gap:12px;
            padding:9px 0;
            border-bottom:1px solid rgba(255,255,255,.1);
            font-size:1rem;
        }

        .tr:last-child{
            border-bottom:0;
        }

        .tr span{
            color:var(--mu);
        }

        .tr b{
            color:var(--cy);
        }

        /* =========================================================
           Capability profile
           ========================================================= */

        .mgrid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            align-items:start;
            gap:20px;
            max-width:1000px;
            margin-bottom:20px;
        }

        .mgrid.b3{
            grid-template-columns:repeat(3,1fr);
        }

        .mt{
            display:flex;
            flex-direction:column;
            max-width:880px;
            margin-bottom:26px;
        }

        .mgrid .mt{
            max-width:none;
            margin-bottom:0;
        }

        .al{
            display:block;

                        worst.biz+=0;
                        raw.biz+=good?1:0;
                    });

                    SIGS.forEach(function(sg,i){
                        if(!S.sig[i])return;

                        var good=S.sig[i]===sg.ok;

                        ev.data++;
                        best.data+=3;
                        worst.data+=0;
                        raw.data+=good?3:0;

                        ev.stratal++;
                        best.stratal+=1;
                        worst.stratal+=0;
                        raw.stratal+=good?1:0;
                    });

                    var comDone=0;

                    ["a","b","c","d","e"].forEach(function(k){
                        if(filled(S.com[k],3))comDone++;
                    });

                    if(S.stage===LAST){
                        ev.career++;
                        best.career+=10;
                        worst.career+=0;
                        raw.career+=Math.round(comDone/5*10);
                    }

                    var out={};

                    MET_ALL.forEach(function(k){
                        if(ev[k]===0){
                            out[k]={
                                pct:0,
                                ev:0,
                                tier:{k:"nosig",l:"Not enough signal"}
                            };
                            return;
                        }

                        var span=best[k]-worst[k];
                        var pct=span<=0
                            ?50
                            :Math.round((raw[k]-worst[k])/span*100);

                        pct=Math.max(0,Math.min(100,pct));

                        out[k]={
                            pct:pct,
                            ev:ev[k],
                            tier:tierOf(pct)
                        };
                    });

                    return out;
                }

                function ranked(sc){
                    return MET_ALL
                        .filter(function(k){
                            return sc[k].ev>0;
                        })
                        .sort(function(a,b){
                            if(sc[b].pct!==sc[a].pct){
                                return sc[b].pct-sc[a].pct;
                            }

                            return MET_ALL.indexOf(a)-MET_ALL.indexOf(b);
                        });
                }

                            st===3?2:(st===11?10:st-1),
                            null,
                            "Next Scenario →",
                            "Choose an option to continue."
                        );
                    }
                }

                function bridgeLines(){
                    var a=S.ans[6];

                    if(a===1){
                        return[
                            "The peer-champion network is live. Your first session had twelve people from four teams. Adoption is moving: fast near the champions, slower everywhere else.",
                            "One {ts} tells you they get it now, because seeing someone use the tool in context made it click.",
                            "Another team has not engaged yet. They have seen the announcements and are waiting to see whether this sticks before investing time.",
                            "The top performer's team is now in the middle. Not leading, but not quiet anymore. They are asking questions in the peer sessions."
                        ];
                    }

                    if(a===2){
                        return[
                            "The teams you focused on first are thriving. Adoption is deep rather than only broad. People understand why the tools matter for their work, and they are experimenting.",
                            "The teams you have not reached yet are watching. Some have started small experiments. Others are holding back until they see proof it is worth their time.",
                            "The top performer's team is waiting. They are not resisting. They are simply not moving without a clearer reason to."
                        ];
                    }

                    if(a===0){
                        return[
                            "The rollout stayed on schedule. Adoption numbers are up, technically. Everyone has the tools and everyone completed onboarding.",
                            "But in review sessions people are using the tools because they have to, not because they understand why.",
                            "The top performer's team is still quiet. Their numbers are up, but mostly on paper. Managers are managing compliance rather than building confidence."
                        ];
                    }

                    return[
                        "The change management hire is taking longer than expected. The rollout timeline is under pressure and people are waiting.",
                        "Before the new person arrives, adoption momentum starts to stall. When they finally step in, they inherit ambiguity instead of forward motion."
                    ];
                }

                function sBridge(p){
                    p.appendChild(
                        el(
                            "p",
                            "bn",
                            "No response is required in this section. Pause to notice how your earlier choices are showing up before you review the next field signals."
                        )
                    );

                    var b=el("div","bg");

                    bridgeLines().forEach(function(x){
                        b.appendChild(el("p","",x));
                    });

                    p.appendChild(b);

                    nav(
                        p,
                        6,
                        function(){go(8);},
                        "Continue",
                        null
                    );
                }

                function sSignals(p){
                    skillStrip(p,8);

                    p.appendChild(
                        el(
                            "p",
                            "brg",
                            "The field is talking now, in fragments rather than dashboards. Your task is to distinguish confidence barriers from access and habit barriers."
                        )
                    );

                    var t=document.createElement("table");
                    t.className="mx";

                    var cap=document.createElement("caption");
                    cap.textContent=
                        "Choose one interpretation for each field signal. All five rows are required.";

                    t.appendChild(cap);

                    var thead=document.createElement("thead");
                    var hr=document.createElement("tr");
                    var h0=document.createElement("th");

                    h0.scope="col";
                    h0.textContent="What came back";
                    hr.appendChild(h0);

                    GAPS.forEach(function(g){
                        var th=document.createElement("th");
                        th.scope="col";
                        th.appendChild(document.createTextNode(g.l));
                        th.appendChild(el("span","chs",g.sub));
                        hr.appendChild(th);
                    });

                    thead.appendChild(hr);
                    t.appendChild(thead);

                    var tb=document.createElement("tbody");
                    var all=true;

                    SIGS.forEach(function(sg,i){
                        var row=document.createElement("tr");
                        var th=document.createElement("th");

                        th.scope="row";
                        th.className="sg";
                        th.textContent="“"+tk(sg.q)+"”";
                        row.appendChild(th);

                        var cur=S.sig[i];

                        GAPS.forEach(function(g){
                            var td=document.createElement("td");
                            var lab=el("label","rd");
                            var inp=document.createElement("input");

                            inp.type="radio";
                            inp.name="sigrow"+i;
                            inp.value=g.v;
                            inp.checked=cur===g.v;
                            inp.id="s"+i+"_"+g.v;

                            inp.onchange=function(){
                                S.sig[i]=g.v;
                                S.sigSeen[i]=1;
                                focusNext=false;
                                pendingFocus=inp.id;
                                render();
                                say("Recorded. Signal "+(i+1)+" of 5.");
                            };

                            lab.appendChild(inp);
                            lab.appendChild(el("span","dot",""));
                            lab.appendChild(el("span","ml",g.l));
                            td.appendChild(lab);
                            row.appendChild(td);
                        });

                        tb.appendChild(row);

                        if(!cur){
                            all=false;
                        }else{
                            var fr=document.createElement("tr");
                            var fc=document.createElement("td");
                            fc.className="fc";
                            fc.colSpan=4;

                            var ok=cur===sg.ok;

                            fc.appendChild(
                                fbBox(
                                    {
                                        t:ok?"confirm":"reconsider",
                                        c:sg.f[cur],
                                        r:ok
                                            ?null
                                            :"There is a more accurate read for this one. You can change it."
                                    },
                                    null
                                )
                            );

                            fr.appendChild(fc);
                            tb.appendChild(fr);
                        }
                    });

                    t.appendChild(tb);
                    p.appendChild(t);

                    if(!all){
                        nav(
                            p,
                            7,
                            null,
                            "Continue",
                            "Choose a read for all five signals to continue."
                        );
                        return;
                    }

                    p.appendChild(el("p","pr",SYN.p));

                    optionList(
                        p,
                        SYN.o,
                        S.syn,
                        function(i){
                            S.syn=i;
                            focusNext=false;
                            pendingFocus="optGroupSyn";
                            render();
                            say("Intervention selected.");
                        },
                        "Choose the intervention you would fund",
                        "optGroupSyn"
                    );

                    if(S.syn!==null){
                        p.appendChild(
                            fbBox(
                                SYN.o[S.syn],
                                function(){
                                    S.syn=null;
                                    focusNext=false;
                                    render();
                                },
                                "optGroupSyn",
                                function(){go(9);}
                            )
                        );
                    }
                }

                function sRecap(p){
                    p.appendChild(
                        el(
                            "p",
                            "brg",
                            "Here is how your leadership choices are showing up so far. Coaching and your own development area build in the second half."
                        )
                    );

                    var sc=scoreDetail();
                    var g=el("div","mgrid");

                    RECAP.forEach(function(k){
                        g.appendChild(
                            meter(k,sc,false,true,false)
                        );
                    });

                    p.appendChild(g);
                    fillBars(p);

                    nav(
                        p,
                        8,
                        function(){go(10);},
                        "Continue",
                        null
                    );
                }

                function sIntro(p){
                    var pn=el("div","pn");

                    pn.appendChild(
                        el(
                            "p",
                            "",
                            "AI adoption is not a one-time rollout. It requires continuous application of new capabilities — and coaching that spans the entire organizational hierarchy."
                        )
                    );

                    p.appendChild(pn);
                    leCallout(p,10);

                    p.appendChild(
                        el(
                            "div",
                            "sk",
                            "Three moments land on your radar in the same week. None show up in a dashboard. All influence whether adoption sticks or merely spreads."
                        )
                    );

                    nav(
                        p,
                        9,
                        function(){go(11);},
                        "Continue",
                        null
                    );
                }

                function sRefl(p){
                    skillStrip(p,14);

                    p.appendChild(el("p","pr",REFL.p));

                    p.appendChild(
                        el(
                            "div",
                            "ins",
                            "This one is about recognising how you actually work, not about scoring. What you choose shapes the first commitment on the next screen."
                        )
                    );

                    optionList(
                        p,
                        REFL.o,
                        S.refl,
                        function(i){
                            S.refl=i;
                            focusNext=false;
                            pendingFocus="optGroupRefl";
                            render();
                        },
                        "Choose the coaching moment most like you",
                        "optGroupRefl"
                    );

                    if(S.refl!==null){
                        p.appendChild(
                            fbBox(
                                REFL.o[S.refl],
                                function(){
                                    S.refl=null;
                                    focusNext=false;
                                    render();
                                },
                                "optGroupRefl",
                                function(){go(15);}
                            )
                        );
                    }
                }

                function inputField(parent,id,labelText,hintText,multiline,key){
                    var lab=document.createElement("label");
                    lab.htmlFor=id;
                    lab.textContent=tk(labelText);
                    parent.appendChild(lab);

                    var hint=el("p","fh",hintText);
                    hint.id=id+"Hint";
                    parent.appendChild(hint);

                    var f=document.createElement(
                        multiline?"textarea":"input"
                    );

                    if(!multiline)f.type="text";

                    f.id=id;
                    f.value=S.com[key];
                    f.setAttribute("aria-describedby",hint.id);

                    f.oninput=function(){
                        S.com[key]=f.value;
                        save();
                    };

                    parent.appendChild(f);
                }

                function sResults(p){
                    var sc=scoreDetail();
                    var rank=ranked(sc);
                    var hi=rank[0]||null;
                    var lo=rank[rank.length-1]||null;

                    var head=el("div","rh");

                    if(hi&&lo){
                        head.appendChild(
                            document.createTextNode(
                                "Your strongest area this run was "
                            )
                        );

                        head.appendChild(el("b","",M[hi].name));

                        head.appendChild(
                            document.createTextNode(
                                ". The clearest place to build on is "
                            )
                        );

                        head.appendChild(el("b","",M[lo].name));

                        head.appendChild(
                            document.createTextNode(
                                ". Carry that second one into the next section of the course."
                            )
                        );
                    }

                    p.appendChild(head);

                    var pf=el("div","pfw");
                    pf.appendChild(el("h3","","Your capability profile"));

                    pf.appendChild(
                        el("div","sc first","Leader Expectations")
                    );

                    var g1=el("div","mgrid b3");

                    G_LE.forEach(function(k){
                        g1.appendChild(meter(k,sc,true,false,true));
                    });

                    pf.appendChild(g1);

                    pf.appendChild(
                        el("div","sc","Guiding Principle skills")
                    );

                    var g2=el("div","mgrid b3");

                    G_GP.forEach(function(k){
                        g2.appendChild(meter(k,sc,true,false,true));
                    });

                    pf.appendChild(g2);

                    pf.appendChild(
                        el("div","sc","Further leadership skills")
                    );

                    var g3=el("div","mgrid b3");

                    G_LS.forEach(function(k){
                        g3.appendChild(meter(k,sc,true,false,true));
                    });

                    pf.appendChild(g3);
                    p.appendChild(pf);

                    var cfg=CB[lo]||CB.rel;
                    var cm=el("div","cm");

                    cm.appendChild(el("h3","","Your commitments"));

                    cm.appendChild(
                        el(
                            "p",
                            "",
                            "Turn your choices into observable real-work actions."
                        )
                    );

                    var f1=document.createElement("fieldset");
                    var lg1=document.createElement("legend");

                    lg1.textContent=tk(cfg.lg);
                    f1.appendChild(lg1);

                    inputField(f1,"cA",cfg.q,cfg.h,true,"a");

                    inputField(
                        f1,
                        "cB",
                        "When will you do it?",
                        "Be specific. For example, Tuesday's one-to-one or the next {rv}.",
                        false,
                        "b"
                    );

                    inputField(f1,cfg.q2? "cC":"cC",cfg.q2,cfg.h2,true,"c");

                    cm.appendChild(f1);

                    var f2=document.createElement("fieldset");
                    var lg2=document.createElement("legend");

                    lg2.textContent="Coaching in the flow of work";
                    f2.appendChild(lg2);

                    inputField(
                        f2,
                        "cD",
                        "One coaching moment you will take instead of fixing it yourself",
                        "For example, ask what they think the {cl} cared about before suggesting a revision.",
                        true,
                        "d"
                    );

                    inputField(
                        f2,
                        "cE",
                        "Where will it happen?",
                        "For example, in the next {rv}, project check-in, or one-to-one.",
                        true,
                        "e"
                    );

                    cm.appendChild(f2);

                    var challenge=el("div","pchallenge");

                    challenge.appendChild(
                        el("b","","The Pacesetter Challenge")
                    );

                    challenge.appendChild(
                        el(
                            "p",
                            "",
                            "Pacesetters do not build habits in secret. Take your printed commitment and add it to the agenda for your next one-to-one with your manager or a peer. Discuss one trade-off you made today."
                        )
                    );

                    cm.appendChild(challenge);

                    var acts=el("div","ca");

                    var printBtn=el(
                        "button",
                        "gh",
                        "Print / Save as PDF"
                    );

                    printBtn.type="button";

                    printBtn.onclick=function(){
                        window.print();
                    };

                    acts.appendChild(printBtn);
                    cm.appendChild(acts);
                    p.appendChild(cm);

                    var rw=el("div","rw");

                    var restart=el(
                        "button",
                        "bk",
                        "Restart the scenario"
                    );

                    restart.type="button";

                    var armed=false;

                    restart.onclick=function(){
                        if(!armed){
                            armed=true;
                            restart.className="bk gh arm";
                            restart.textContent=
                                "Confirm restart — this clears your commitments";

                            say(
                                "Press again to restart. This clears everything you have typed."
                            );

                            setTimeout(function(){
                                if(!armed)return;

                                armed=false;
                                restart.className="bk";
                                restart.textContent="Restart the scenario";
                            },6000);

                            return;
                        }

                        S=fresh();
                        save();
                        focusNext=true;
                        render();
                    };

                    rw.appendChild(restart);
                    p.appendChild(rw);

                    fillBars(p);
                }

                function stepper(){
                    var list=document.getElementById("stepper");
                    var sel=document.getElementById("stageSel");

                    if(!list||!sel)return;

                    list.innerHTML="";
                    sel.innerHTML="";

                    STAGES.forEach(function(label,i){
                        var open=canMoveTo(i);
                        var complete=isDone(i)&&i<S.stage;
                        var current=i===S.stage;

                        var li=document.createElement("li");
                        var cls=[];

                        if(complete)cls.push("dn");
                        if(current)cls.push("cu");
                        if(!open)cls.push("lk");

                        li.className=cls.join(" ");

                        var b=document.createElement("button");
                        b.type="button";

                        var state=!open
                            ?". Locked. "+lockMsg(i)
                            :(complete
                                ?". Completed."
                                :(current?". Current section.":""));

                        b.setAttribute(
                            "aria-label",
                            label+
                                ". Section "+
                                (i+1)+
                                " of "+
                                STAGES.length+
                                state
                        );

                        if(current)b.setAttribute("aria-current","step");
                        if(!open)b.setAttribute("aria-disabled","true");

                        b.appendChild(el("span","sb",""));

                        var pair=TAB_LABELS[i]||[label,""];
                        var wrap=el("span","tlab","");
                        var l1=el("span","tln","");
                        var gl=el("span","tgl","");

                        gl.textContent=!open
                            ?"🔒"
                            :(complete?"✓":" ");

                        gl.setAttribute("aria-hidden","true");

                        l1.appendChild(gl);
                        l1.appendChild(
                            document.createTextNode(pair[0])
                        );

                        wrap.appendChild(l1);

                        var two=pair[1]||"";
                        var l2=el(
                            "span",
                            "tln"+(two?"":" e"),
                            ""
                        );

                        l2.textContent=two||" ";
                        wrap.appendChild(l2);
                        b.appendChild(wrap);

                        b.onclick=open
                            ?function(){go(i);}
                            :function(){say(lockMsg(i));};

                        li.appendChild(b);
                        list.appendChild(li);

                        var op=document.createElement("option");

                        op.value=String(i);
                        op.textContent=
                            (i+1)+
                            ". "+
                            label+
                            (!open
                                ?" (locked)"
                                :(complete?" ✓":""));

                        op.disabled=!open;
                        if(current)op.selected=true;

                        sel.appendChild(op);
                    });

                    sel.onchange=function(){
                        go(parseInt(sel.value,10));
                    };
                }

                function scrollTop(){
                    var reduce=false;

                    try{
                        reduce=!!(
                            window.matchMedia &&
                            window.matchMedia(
                                "(prefers-reduced-motion: reduce)"
                            ).matches
                        );
                    }catch(e){}

                    if(reduce){
                        try{window.scrollTo(0,0);}
                        catch(e){}
                        return;
                    }

                    try{
                        window.scrollTo({
                            top:0,
                            left:0,
                            behavior:"smooth"
                        });
                    }catch(e){
                        try{window.scrollTo(0,0);}
                        catch(e2){}
                    }
                }

                function go(st){
                    if(st<0)st=0;
                    if(st>LAST)st=LAST;

                    if(!canMoveTo(st)){
                        say(lockMsg(st));
                        return;
                    }

                    S.stage=st;
                    focusNext=true;
                    render();
                    scrollTop();
                }

                function render(){
                    var p=document.getElementById("stage");
                    if(!p)return;

                    if(!canMoveTo(S.stage)){
                        S.stage=firstIncomplete();
                    }

                    p.innerHTML="";

                    var h=el(
                        "h2",
                        "vh",
                        STAGES[S.stage]||STAGES[0]
                    );

                    h.id="stageHeading";
                    h.tabIndex=-1;
                    p.appendChild(h);

                    switch(S.stage){
                        case 0:
                            sRole(p);
                            break;
                        case 1:
                            sStart(p);
                            break;
                        case 2:
                            sPattern(p);
                            break;
                        case 3:
                        case 4:
                        case 5:
                        case 6:
                        case 11:
                        case 12:
                        case 13:
                            sDecision(p,S.stage);
                            break;
                        case 7:
                            sBridge(p);
                            break;
                        case 8:
                            sSignals(p);
                            break;
                        case 9:
                            sRecap(p);
                            break;
                        case 10:
                            sIntro(p);
                            break;
                        case 14:
                            sRefl(p);
                            break;
                        case 15:
                            sResults(p);
                            break;
                        default:
                            S.stage=0;
                            sRole(p);
                    }

                    stepper();
                    save();

                    if(pendingFocus){
                        var t=document.getElementById(pendingFocus);

                        if(t){
                            try{t.focus();}
                            catch(e){}

                            if(
                                t.getAttribute &&
                                t.getAttribute("role")==="radiogroup"
                            ){
                                var f=t.querySelector(
                                    '[tabindex="0"]'
                                )||t.querySelector("button");

                                if(f){
                                    try{f.focus();}
                                    catch(e){}
                                }
                            }

                            if(
                                (pendingFocus==="next12"||
                                pendingFocus==="auth5") &&
                                t.setSelectionRange
                            ){
                                try{
                                    t.setSelectionRange(
                                        t.value.length,
                                        t.value.length
                                    );
                                }catch(e){}
                            }
                        }else if(focusNext){
                            h.focus();
                        }

                        pendingFocus=null;
                    }else if(focusNext){
                        h.focus();
                    }

                    focusNext=true;
                }

                (function(){
                    var btn=document.getElementById("fsBtn");
                    var app=document.getElementById("app");

                    function label(){
                        var fs=
                            document.fullscreenElement||
                            document.webkitFullscreenElement;

                        btn.textContent=(
                            fs||app.classList.contains("fm")
                        )
                            ?"Exit full screen"
                            :"Full screen";

                        btn.setAttribute(
                            "aria-pressed",
                            (fs||app.classList.contains("fm"))
                                ?"true"
                                :"false"
                        );
                    }

                    function focusMode(on){
                        app.classList.toggle("fm",on);
                        label();

                        say(
                            on
                                ?"Focus mode on. The activity now uses the full embed area."
                                :"Focus mode off."
                        );
                    }

                    btn.setAttribute("aria-pressed","false");

                    btn.onclick=function(){
                        var fsEl=
                            document.fullscreenElement||
                            document.webkitFullscreenElement;

                        if(fsEl){
                            try{
                                (
                                    document.exitFullscreen||
                                    document.webkitExitFullscreen
                                ).call(document);
                            }catch(e){}

                            label();
                            return;
                        }

                        if(app.classList.contains("fm")){
                            focusMode(false);
                            return;
                        }

                        var req=
                            app.requestFullscreen||
                            app.webkitRequestFullscreen;

                        if(!req){
                            focusMode(true);
                            return;
                        }

                        try{
                            var r=req.call(app);

                            if(r&&r.then){
                                r.then(label,function(){
                                    focusMode(true);
                                });
                            }else{
                                setTimeout(label,120);
                            }
                        }catch(e){
                            focusMode(true);
                        }
                    };

                    document.addEventListener(
                        "fullscreenchange",
                        label
                    );

                    document.addEventListener(
                        "webkitfullscreenchange",
                        label
                    );
                })();

                S=load()||fresh();
                toastStage=S.stage;
                toastLast=Date.now();
                render();

            }catch(e){
                try{
                    var box=document.createElement("div");
                    box.className="errbox";

                    var h=document.createElement("h2");
                    h.textContent=
                        "This activity hit an error during setup. Screenshot this box.";

                    box.appendChild(h);

                    box.appendChild(
                        document.createTextNode(
                            (e&&e.message?e.message:String(e))+
                            (e&&e.stack
                                ?"\n\nStack:\n"+e.stack
                                :"")
                        )
                    );

                    var host=document.getElementById("stage")||document.body;
                    host.insertBefore(box,host.firstChild);
                }catch(e2){}
            }
        })();
    </script>
