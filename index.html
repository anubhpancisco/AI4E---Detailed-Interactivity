<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1.0"
        />
        <title>Leadership &amp; Social Influence · Skill Application</title>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");

            :root{
                --bg:#07182D;
                --p1:rgba(255,255,255,.06);
                --p2:rgba(255,255,255,.08);
                --w:#FFFFFF;
                --mu:rgba(255,255,255,.72);
                --cy:#02C8FF;
                --cyl:#8FE6FF;
                --bl:#0A60FF;
                --gr:#8fd86e;
                --yl:#ffcb4d;
                --pk:#FF007F;
                --or:#FF9000;
                --pu:#b48cff;
                --tl2:#59d4b4;
                --lk:#7d90a6;
                --ln:rgba(255,255,255,.16);
                --br:linear-gradient(90deg,#0A60FF 5%,#02C8FF 37%,#02C8FF 43%,#FF007F 75%,#FF9000 94%);
            }

            *{box-sizing:border-box}
            html,body{margin:0;padding:0;background:transparent}

            body,
            button,
            input,
            textarea,
            select{
                font-family:"Inter",Arial,sans-serif;
                font-weight:400;
            }

            body{
                color:var(--w);
                font-size:16px;
                line-height:1.5;
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
            }

            h1,h2,h3,h4,h5{font-weight:700}
            b,strong,legend,caption,summary,dt,optgroup,th{font-weight:600}

            button{
                font:inherit;
                cursor:pointer;
            }

            #app{
                width:100%;
                max-width:1100px;
                margin:auto;
                padding:28px 24px;
            }

            .shell{
                overflow:hidden;
                background:var(--bg);
                border:1px solid rgba(255,255,255,.12);
                border-radius:12px;
                box-shadow:0 10px 28px rgba(0,0,0,.3);
            }

            .hd{padding:28px 48px 0}
            .scrollwrap{overflow:visible}
            .stage{min-height:450px;padding:38px 48px 46px}

            #app.fm{
                width:100%;
                max-width:none;
                min-height:100vh;
                margin:0;
                padding:6px 10px;
            }

            #app.fm .shell{min-height:calc(100vh - 12px)}
            #app.fm .hd{padding:12px 28px 0}
            #app.fm h1{font-size:1rem}
            #app.fm .st{margin-top:14px}
            #app.fm .stage{min-height:0;padding:24px 28px 32px}

            #app:fullscreen,
            #app:-webkit-full-screen{
                width:100%;
                max-width:none;
                min-height:100vh;
                margin:0;
                padding:16px;
                background:var(--bg);
            }

            #app:fullscreen .shell,
            #app:-webkit-full-screen .shell{
                min-height:calc(100vh - 32px);
            }

            .tp{
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:14px;
                flex-wrap:wrap;
            }

            h1{
                max-width:620px;
                margin:0;
                color:var(--cy);
                font-size:1.1rem;
                line-height:1.4;
                letter-spacing:.08em;
                text-transform:uppercase;
            }

            .hbr{
                display:flex;
                flex-wrap:wrap;
                gap:10px;
            }

            .hb{
                min-height:44px;
                padding:10px 16px;
                color:var(--w);
                background:transparent;
                border:1px solid rgba(255,255,255,.45);
                border-radius:24px;
                font-size:.85rem;
            }

            .hb:hover,
            .bk:hover{
                background:rgba(255,255,255,.1);
            }

            .inst-panel{
                margin-top:20px;
                padding:20px 24px;
                color:var(--mu);
                background:var(--p1);
                border-left:4px solid var(--cy);
                border-radius:10px;
                font-size:.95rem;
                line-height:1.6;
            }

            .inst-panel h2{
                margin:0 0 10px;
                color:#fff;
                font-size:1.05rem;
            }

            .inst-panel ul{margin:0;padding-left:22px}
            .inst-panel li{margin-bottom:8px}
            .inst-panel li:last-child{margin-bottom:0}

            .st{
                display:flex;
                flex-wrap:wrap;
                align-items:flex-start;
                gap:8px;
                margin:24px 0 0;
                padding:0;
                list-style:none;
            }

            .st li{
                display:block;
                flex:1 1 94px;
                min-width:94px;
                vertical-align:top;
            }

            .st button{
                display:block;
                width:100%;
                padding:0 2px;
                color:var(--mu);
                background:none;
                border:0;
                text-align:center;
            }

            .sb{
                display:block;
                height:7px;
                margin-bottom:8px;
                background:rgba(255,255,255,.2);
                border-radius:5px;
                transition:background .25s;
            }

            .st li.dn .sb{background:var(--gr)}
            .st li.cu .sb{background:var(--pk)}

            .tlab{display:block;padding-bottom:6px}

            .tln{
                display:block;
                height:1.34em;
                overflow:hidden;
                font-size:.76rem;
                line-height:1.34;
                white-space:nowrap;
                text-overflow:ellipsis;
            }

            .tgl{
                display:inline-block;
                width:1.15em;
                overflow:hidden;
                font-size:.68rem;
                text-align:left;
                vertical-align:baseline;
            }

            .st li.dn .tgl{color:var(--gr)}

            .st li.cu .tln:not(.e){
                color:#fff;
                text-decoration:underline;
                text-underline-offset:3px;
            }

            .st button:hover .tln{color:#fff}
            .st li.lk button{cursor:not-allowed}

            .st li.lk .tln,
            .st li.lk .tgl{color:var(--lk)}

            .st li.lk .sb{background:rgba(255,255,255,.14)}
            .st li.lk button:hover .tln{color:var(--lk)}

            .mnav{display:none;margin:20px 0 0}

            .mnav label{
                display:block;
                margin:0 0 6px;
                color:var(--mu);
                font-size:.85rem;
            }

            .mnav select{
                width:100%;
                min-height:46px;
                padding:10px 12px;
                color:#fff;
                background:var(--p2);
                border:1px solid rgba(255,255,255,.32);
                border-radius:7px;
                font-size:.95rem;
            }

            .dv{
                height:1px;
                margin-top:22px;
                background:var(--ln);
            }

            .pr{
                max-width:880px;
                margin:0 0 22px;
                color:#fff;
                font-size:1.12rem;
                line-height:1.62;
                overflow-wrap:anywhere;
            }

            .brg{
                max-width:880px;
                margin:0 0 22px;
                color:var(--cyl);
                font-size:1.05rem;
                font-weight:600;
                line-height:1.62;
                overflow-wrap:anywhere;
            }

            .sk{
                max-width:880px;
                margin-top:26px;
                padding-top:20px;
                color:#fff;
                border-top:1px solid var(--ln);
                font-size:1.12rem;
                line-height:1.6;
            }

            .nt{
                max-width:880px;
                margin-top:20px;
                color:var(--mu);
                font-size:.88rem;
            }

            .warn{
                max-width:880px;
                margin-top:16px;
                padding:12px 16px;
                color:var(--w);
                background:rgba(255,203,77,.12);
                border-left:4px solid var(--yl);
                border-radius:8px;
                font-size:.88rem;
            }

            .bn{
                max-width:880px;
                margin:0 0 18px;
                padding:14px 18px;
                color:var(--mu);
                background:rgba(255,255,255,.05);
                border-radius:8px;
                font-size:.88rem;
            }

            .ins{
                display:flex;
                gap:10px;
                max-width:880px;
                margin:0 0 26px;
                padding:16px 20px;
                color:var(--mu);
                background:var(--p1);
                border-radius:9px;
                font-size:.93rem;
                line-height:1.6;
                overflow-wrap:anywhere;
            }

            .obj{
                max-width:880px;
                margin:0 0 22px;
                padding:18px 22px;
                background:var(--p1);
                border-left:4px solid var(--cyl);
                border-radius:10px;
            }

            .obj h3{
                margin:0 0 10px;
                color:var(--cyl);
                font-size:.78rem;
                letter-spacing:.08em;
                text-transform:uppercase;
            }

            .obj ol{
                margin:0;
                padding-left:22px;
                color:var(--mu);
            }

            .obj li{
                margin-bottom:8px;
                font-size:1rem;
                line-height:1.55;
            }

            .obj li:last-child{margin-bottom:0}

            .rl{
                display:flex;
                flex-wrap:wrap;
                gap:12px;
                max-width:900px;
            }

            .ro{
                min-height:52px;
                padding:12px 21px;
                color:var(--w);
                background:var(--p1);
                border:1px solid rgba(255,255,255,.3);
                border-radius:28px;
                font-size:.95rem;
                text-align:left;
            }

            .ro:hover{
                background:var(--p2);
                border-color:#fff;
            }

            .ro.sel{
                color:#062033;
                background:var(--cy);
                border-color:var(--cy);
            }

            .ch{
                display:grid;
                gap:14px;
                max-width:940px;
            }

            .cb{
                width:100%;
                min-height:56px;
                padding:18px 24px;
                color:#071b2e;
                background:linear-gradient(#fff,#fff) padding-box,var(--br) border-box;
                border:2px solid transparent;
                border-radius:10px;
                font-size:1rem;
                line-height:1.5;
                text-align:left;
            }

            .cb:hover{
                box-shadow:0 0 5px rgba(2,200,255,.9),0 0 18px rgba(2,200,255,.4);
            }

            .cb.sel{
                box-shadow:0 0 0 3px rgba(2,200,255,.85) inset,0 0 15px rgba(2,200,255,.45);
            }

            @keyframes slideUpFade{
                0%{opacity:0;transform:translateY(10px)}
                100%{opacity:1;transform:translateY(0)}
            }

            .fb{
                max-width:940px;
                margin-top:20px;
                padding:24px 28px;
                background:rgba(255,255,255,.09);
                border-left:6px solid var(--cy);
                border-radius:10px;
                box-shadow:0 4px 15px rgba(0,0,0,.2);
                animation:slideUpFade .4s ease-out;
            }

            .fb.confirm{border-left-color:var(--gr)}
            .fb.reconsider{border-left-color:var(--pk)}
            .fb.explore{border-left-color:var(--yl)}

            .fb p{
                margin:0;
                color:#fff;
                font-size:1.05rem;
                line-height:1.6;
                overflow-wrap:anywhere;
            }

            .fb-acts{
                display:flex;
                flex-wrap:wrap;
                align-items:center;
                gap:12px;
                margin-top:20px;
                padding-top:16px;
                border-top:1px solid rgba(255,255,255,.1);
            }

            .sr{
                display:flex;
                flex-wrap:wrap;
                align-items:center;
                gap:10px;
                margin-top:14px;
            }

            .sl2{
                color:var(--mu);
                font-size:.75rem;
                letter-spacing:.07em;
                text-transform:uppercase;
            }

            .chip{
                padding:5px 12px;
                color:#062033;
                background:var(--cy);
                border-radius:999px;
                font-size:.8rem;
            }

            .sn{
                color:var(--mu);
                font-size:.9rem;
                overflow-wrap:anywhere;
            }

            .rt{
                margin-top:14px !important;
                color:var(--mu) !important;
                font-size:.88rem !important;
            }

            .gh{
                min-height:44px;
                padding:9px 18px;
                color:var(--mu);
                background:transparent;
                border:1px dashed rgba(255,255,255,.5);
                border-radius:8px;
                font-size:.95rem;
            }

            .gh:hover{
                color:#fff;
                border-color:#fff;
            }

            .gh.arm{
                color:var(--yl);
                border-color:var(--yl);
                border-style:solid;
            }

            .le{
                max-width:940px;
                margin-top:16px;
                padding:16px 20px;
                background:var(--p1);
                border-left:4px solid var(--cyl);
                border-radius:10px;
                font-size:1rem;
                line-height:1.6;
            }

            .leh{
                display:block;
                margin-bottom:6px;
                color:var(--cyl);
                font-size:.78rem;
                letter-spacing:.08em;
                text-transform:uppercase;
            }

            .led{color:var(--mu)}

            .skx{
                display:flex;
                flex-wrap:wrap;
                align-items:center;
                gap:10px 26px;
                max-width:940px;
                margin:0 0 22px;
                padding-bottom:16px;
                border-bottom:1px solid var(--ln);
            }

            .skg{
                display:flex;
                flex-wrap:wrap;
                align-items:center;
                gap:8px;
            }

            .skx .lbl{
                color:var(--mu);
                font-size:.74rem;
                letter-spacing:.07em;
                text-transform:uppercase;
            }

            .tag{
                padding:4px 11px;
                color:var(--w);
                background:rgba(255,255,255,.09);
                border:1px solid rgba(255,255,255,.22);
                border-radius:999px;
                font-size:.78rem;
            }

            .tag.pri{
                color:#062033;
                background:var(--cyl);
                border-color:var(--cyl);
            }

            .pn,.bg,.au,.mine,.nx,.tl,.rh,.ph,.cm,.rs,.af,.ob,.pfw{
                overflow-wrap:anywhere;
            }

            .pn{
                max-width:940px;
                margin:0 0 22px;
                padding:22px 26px;
                background:var(--p1);
                border-radius:10px;
            }

            .pn p{
                margin:0;
                font-size:1rem;
                line-height:1.6;
            }

            .bg{
                max-width:940px;
                margin-top:24px;
                padding:20px 24px;
                background:var(--p1);
                border-left:4px solid var(--yl);
                border-radius:10px;
            }

            .bg p{
                margin:0 0 18px;
                color:#fff;
                font-size:1rem;
                line-height:1.55;
            }

            .bg p:last-child{margin-bottom:0}

            .au{
                max-width:940px;
                margin:0 0 24px;
                padding:22px 26px;
                background:var(--p1);
                border-left:4px solid var(--yl);
                border-radius:10px;
            }

            .au h3,.nx h3{
                margin:0 0 8px;
                color:#fff;
                font-size:1rem;
            }

            .au p.aui,.nx p.aui{
                margin:0 0 14px;
                color:var(--mu);
                font-size:.93rem;
                line-height:1.6;
            }

            .au .cnt{
                margin:8px 0 0;
                color:var(--mu);
                font-size:.88rem;
            }

            .mine{
                max-width:940px;
                margin:0 0 22px;
                padding:18px 22px;
                background:rgba(255,255,255,.05);
                border-left:4px solid var(--yl);
                border-radius:10px;
            }

            .mine .mh{
                display:block;
                margin-bottom:8px;
                color:var(--yl);
                font-size:.78rem;
                letter-spacing:.08em;
                text-transform:uppercase;
            }

            .mine .mq{
                margin:0;
                font-size:1rem;
                line-height:1.6;
            }

            .nx{
                max-width:940px;
                margin-top:20px;
                padding:20px 24px;
                background:var(--p1);
                border-left:4px solid var(--gr);
                border-radius:10px;
            }

            .nv{
                display:flex;
                flex-wrap:wrap;
                justify-content:space-between;
                gap:15px;
                max-width:940px;
                margin-top:32px;
                padding-top:24px;
                border-top:1px solid var(--ln);
            }

            .nr{
                display:flex;
                flex-wrap:wrap;
                align-items:center;
                gap:14px;
            }

            .bk,.co{
                min-height:48px;
                padding:11px 22px;
                border-radius:8px;
                font-size:.95rem;
                font-weight:600;
            }

            .bk{
                color:var(--w);
                background:transparent;
                border:1px solid rgba(255,255,255,.42);
            }

            .co{
                color:#062033;
                background:linear-gradient(var(--cy),var(--cy)) padding-box,var(--br) border-box;
                border:2px solid transparent;
            }

            .co.off,
            .co:disabled{
                opacity:.45;
                cursor:not-allowed;
            }

            .hn{
                max-width:300px;
                color:var(--mu);
                font-size:.9rem;
                overflow-wrap:anywhere;
            }

            table.mx{
                width:100%;
                max-width:1000px;
                margin:0 0 24px;
                border-collapse:collapse;
            }

            table.mx caption{
                padding-bottom:14px;
                color:var(--mu);
                font-size:.9rem;
                text-align:left;
            }

            table.mx th,table.mx td{border:1px solid var(--ln)}

            table.mx thead th{
                padding:13px 9px;
                color:#fff;
                background:var(--p1);
                font-size:.86rem;
                line-height:1.35;
                vertical-align:top;
            }

            .chs{
                display:block;
                margin-top:3px;
                color:var(--mu);
                font-size:.76rem;
            }

            table.mx th.sg{
                width:44%;
                padding:16px;
                color:#fff;
                background:rgba(255,255,255,.04);
                font-size:.96rem;
                line-height:1.55;
                text-align:left;
            }

            table.px th.sg{width:46%}
            table.mx td{padding:10px 8px;text-align:center}
            table.px td{padding:8px}
            .ml{display:none}
            td.fc{padding:0!important}
            td.fc .fb{max-width:none;margin:0;border-radius:0}

            .rd{
                display:flex;
                align-items:center;
                justify-content:center;
                gap:10px;
                min-height:46px;
                padding:0 8px;
                margin:0;
                cursor:pointer;
                border-radius:7px;
            }

            .rd:hover{background:rgba(255,255,255,.06)}

            .rd input{
                position:absolute;
                width:1px;
                height:1px;
                margin:-1px;
                padding:0;
                overflow:hidden;
                clip:rect(0,0,0,0);
                border:0;
            }

            .dot{
                display:inline-block;
                flex:0 0 auto;
                width:22px;
                height:22px;
                background:transparent;
                border:2px solid rgba(255,255,255,.55);
                border-radius:50%;
                transition:background .2s,border-color .2s;
            }

            .rd:hover .dot{border-color:var(--cy)}
            .rd input:checked+.dot{background:var(--cy);border-color:var(--cy)}

            .rd input:focus-visible+.dot{
                outline:3px solid var(--yl);
                outline-offset:3px;
            }

            .tl{
                max-width:940px;
                margin-bottom:24px;
                padding:20px 24px;
                background:var(--p1);
                border-radius:10px;
            }

            .tl h3{
                margin:0 0 12px;
                color:#fff;
                font-size:.82rem;
                letter-spacing:.08em;
                text-transform:uppercase;
            }

            .tr{
                display:flex;
                justify-content:space-between;
                gap:12px;
                padding:9px 0;
                border-bottom:1px solid rgba(255,255,255,.1);
                font-size:1rem;
            }

            .tr:last-child{border-bottom:0}
            .tr span{color:var(--mu)}
            .tr b{color:var(--cy)}

            .mgrid{
                display:grid;
                grid-template-columns:repeat(4,1fr);
                align-items:start;
                gap:20px;
                max-width:1000px;
                margin-bottom:20px;
            }

            .mgrid.b3{grid-template-columns:repeat(3,1fr)}

            .mt{
                display:flex;
                flex-direction:column;
                max-width:880px;
                margin-bottom:26px;
            }

            .mgrid .mt{max-width:none;margin-bottom:0}

            .al{
                display:block;
                width:100%;
                margin-bottom:10px;
                padding:5px 10px;
                overflow:hidden;
                border:1px solid transparent;
                border-radius:6px;
                font-size:.72rem;
                letter-spacing:.04em;
                line-height:1.4;
                text-align:center;
                white-space:nowrap;
                text-overflow:ellipsis;
            }

            .al.le{color:#062033;background:var(--cy);border-color:var(--cy)}
            .al.gp{color:#fff;background:transparent;border-color:rgba(255,255,255,.45)}
            .al.no{color:transparent;background:transparent;border-color:transparent}

            .mn{
                display:block;
                min-height:2.7em;
                margin-bottom:8px;
                font-size:1rem;
                line-height:1.35;
            }

            .mgw{display:block;margin-bottom:10px}

            .mg{
                display:inline-block;
                padding:4px 12px;
                border-radius:999px;
                font-size:.8rem;
                white-space:nowrap;
            }

            .mg.strong{color:#08210b;background:var(--gr)}
            .mg.developing{color:#342500;background:var(--yl)}
            .mg.caution{color:#44000d;background:var(--pk)}
            .mg.nosig{color:#fff;background:rgba(255,255,255,.2)}

            .gpn{
                display:block;
                min-height:1.45em;
                margin:0 0 8px;
                color:var(--cy);
                font-size:.84rem;
                line-height:1.45;
            }

            .gpn.e{color:transparent}

            .mk{
                height:16px;
                margin-bottom:10px;
                overflow:hidden;
                background:rgba(255,255,255,.16);
                border-radius:999px;
            }

            .mf{
                width:0;
                height:100%;
                border-radius:999px;
                transition:width .8s ease;
            }

            .f_rel{background:var(--cy)}
            .f_biz{background:var(--pu)}
            .f_net{background:var(--or)}
            .f_coach{background:var(--gr)}
            .f_career{background:var(--yl)}
            .f_data{background:var(--pk)}
            .f_ait{background:var(--bl)}
            .f_stratal{background:var(--tl2)}

            .mc{
                margin:0 0 10px;
                color:var(--mu);
                font-size:.93rem;
            }

            .mdx{
                margin:0 0 10px;
                padding:10px 12px;
                color:var(--w);
                background:rgba(255,255,255,.05);
                border-left:3px solid var(--cy);

                                state.syn=state.syn===undefined?null:state.syn;
                                state.refl=state.refl===undefined?null:state.refl;
                                state.auth5=typeof state.auth5==="string"?state.auth5:"";
                                state.rev5=!!state.rev5;

                                ["a","b","c","d","e","f"].forEach(function(key){
                                    state.com[key]=state.com[key]||"";
                                });

                                return state;
                            }

                            function load(){
                                OLD_KEYS.forEach(function(key){
                                    STORE.del(key);
                                });

                                try{
                                    var raw=STORE.get(KEY);
                                    return raw?normalise(JSON.parse(raw)):null;
                                }catch(e){
                                    STORE.del(KEY);
                                    return null;
                                }
                            }

                            function tk(text){
                                if(typeof text!=="string")return text;

                                var context=CTX[S.role]||CTX.gen;

                                return text.replace(/\{(\w+)\}/g,function(match,key){
                                    var lookup=key.toLowerCase();

                                    if(context[lookup]===undefined)return match;

                                    var value=context[lookup];

                                    return(
                                        key.charAt(0)===key.charAt(0).toUpperCase() &&
                                        key!==lookup
                                    )
                                        ?value.charAt(0).toUpperCase()+value.slice(1)
                                        :value;
                                });
                            }

                            function el(tag,className,text){
                                var node=document.createElement(tag);

                                if(className)node.className=className;
                                if(text!==undefined&&text!==null)node.textContent=tk(text);

                                return node;
                            }

                            function say(text){
                                var live=document.getElementById("live");
                                if(!live)return;

                                live.textContent="";

                                setTimeout(function(){
                                    live.textContent=tk(text);
                                },50);
                            }

                            function dataFor(stage){

                                    return(
                                        managerAnswer!==undefined &&
                                        MGR.o[managerAnswer] &&
                                        MGR.o[managerAnswer].b==="opened"
                                    )
                                        ?F_OPEN
                                        :F_GUARD;
                                }

                                if(stage===6)return SCALE;
                                if(stage===11)return CAREER;
                                if(stage===12)return FLOW;
                                if(stage===13)return PEER;
                                if(stage===14)return REFL;

                                    7:"Three weeks pass. Your scaling decision begins to show up in the work — not as a dashboard result, but in what people say, try, and avoid.",
                                    8:"The field signals are clearer now. You have moved from assumptions to direct evidence about where adoption is breaking down.",
                                    9:"You have made several leadership choices under uncertainty. Before the next set of moments arrives, pause to see the pattern those choices are creating.",
                                    10:"The rollout now enters its most human phase. Adoption does not hold because a tool is available; it holds when people can build confidence in the work around it.",
                                    11:"The first coaching moment is about identity and future direction. Someone is asking what changing work means for their place in it.",
                                    12:"The next moment is more immediate. This is not a future-of-work conversation; it is a live piece of work that needs judgment today.",
                                    13:"You have coached one person in the moment. Now the question becomes how you help expertise move across the team without routing everything through you.",
                                    14:"You have worked through career clarity, coaching in the moment, and peer expertise. Step back now and notice which leadership move feels most natural to you.",
                                    15:"The scenario is complete. Your choices reveal patterns in how you build trust, use evidence, coach capability, and scale expertise."
                                };

                                    ){

                            function psigDone(){
                                for(var i=0;i<PSIGS.length;i++){
                                    if(!S.psig[i])return false;
                                }

                                return true;
                            }

                            function patternOutcome(){
                                if(!psigDone())return null;

                                var totals={trust:0,enable:0,compound:0};

                                for(var i=0;i<PSIGS.length;i++){
                                    totals[S.psig[i]]++;
                                }

                                if(totals.trust>=3)return "trust";
                                if(totals.enable>=3)return "enable";

                                return "both";
                            }

                            function sigsComplete(){
                                for(var i=0;i<SIGS.length;i++){
                                    if(!S.sig[i])return false;
                                }

                                return true;
                            }

                            function filled(value,minLength){
                                return String(value||"").trim().length>=minLength;
                            }

                            function isDone(stage){
                                switch(stage){
                                    case 0:
                                        return S.role!==null;

                                    case 2:
                                        return psigDone();

                                    case 3:
                                    case 4:
                                    case 6:
                                    case 11:
                                    case 13:
                                        return S.ans[stage]!==undefined;

                                    case 5:
                                        return filled(S.auth5,AUTH5.min)&&
                                            S.ans[5]!==undefined;

                                    case 8:
                                        return sigsComplete()&&S.syn!==null;

                                    case 12:
                                        return S.ans[12]!==undefined&&
                                            filled(S.com.f,NEXT12.min);

                                    case 14:
                                        return S.refl!==null;

                                    default:
                                        return true;
                                }
                            }

                            function canMoveTo(stage){
                                if(stage<0||stage>LAST)return false;
                                if(stage<=S.stage)return true;

                                for(var i=0;i<stage;i++){
                                    if(!isDone(i))return false;
                                }

                                return true;
                            }

                            function firstIncomplete(){
                                for(var i=0;i<=LAST;i++){
                                    if(!isDone(i))return i;
                                }

                                return LAST;
                            }

                            function lockMsg(stage){
                                return STAGES[stage]+
                                    " unlocks once you complete "+
                                    STAGES[firstIncomplete()]+".";
                            }
            function tierOf(value){
                                if(value>=70)return{k:"strong",l:"Strong"};
                                if(value>=40)return{k:"developing",l:"Developing"};
                                return{k:"caution",l:"Needs attention"};
                            }

                            function scoreDetail(){
                                var raw={};
                                var best={};
                                var worst={};
                                var evidence={};

                                MET_ALL.forEach(function(key){
                                    raw[key]=0;
                                    best[key]=0;
                                    worst[key]=0;
                                    evidence[key]=0;
                                });

                                function bank(options,chosen){
                                    MET_ALL.forEach(function(key){
                                        var high=null;
                                        var low=null;
                                        var present=false;

                                        options.forEach(function(option){
                                            var value=(option.d&&option.d[key])||0;

                                            if(
                                                option.d &&
                                                option.d[key]!==undefined
                                            ){
                                                present=true;
                                            }

                                            if(high===null||value>high)high=value;
                                            if(low===null||value<low)low=value;
                                        });

                                        if(!present)return;

                                        evidence[key]++;
                                        best[key]+=high;
                                        worst[key]+=low;

                                        raw[key]+=(
                                            (options[chosen].d&&
                                            options[chosen].d[key])||0
                                        );
                                    });
                                }

                                DEC_STAGES.forEach(function(stage){
                                    var data=dataFor(stage);
                                    var answer=S.ans[stage];

                                    if(
                                        !data ||
                                        answer===undefined ||
                                        !data.o[answer]
                                    ){
                                        return;
                                    }

                                    bank(data.o,answer);
                                });

                                if(S.syn!==null&&SYN.o[S.syn]){
                                    bank(SYN.o,S.syn);
                                }

                                if(S.refl!==null&&REFL.o[S.refl]){
                                    bank(REFL.o,S.refl);
                                }

                                PSIGS.forEach(function(signal,index){
                                    if(!S.psig[index])return;

                                    var correct=
                                        signal.ok.indexOf(S.psig[index])>=0;

                                    evidence.data++;
                                    best.data+=2;
                                    raw.data+=correct?2:0;

                                    evidence.biz++;
                                    best.biz+=1;
                                    raw.biz+=correct?1:0;
                                });

                                SIGS.forEach(function(signal,index){
                                    if(!S.sig[index])return;

                                    var correct=S.sig[index]===signal.ok;

                                    evidence.data++;
                                    best.data+=3;
                                    raw.data+=correct?3:0;

                                    evidence.stratal++;
                                    best.stratal+=1;
                                    raw.stratal+=correct?1:0;
                                });

                                var commitmentsDone=0;

                                ["a","b","c","d","e"].forEach(function(key){
                                    if(filled(S.com[key],3)){
                                        commitmentsDone++;
                                    }
                                });

                                if(S.stage===LAST){
                                    evidence.career++;
                                    best.career+=10;
                                    raw.career+=Math.round(
                                        commitmentsDone/5*10
                                    );
                                }

                                var output={};

                                MET_ALL.forEach(function(key){
                                    if(evidence[key]===0){
                                        output[key]={
                                            pct:0,
                                            ev:0,
                                            tier:{
                                                k:"nosig",
                                                l:"Not enough signal"
                                            }
                                        };
                                        return;
                                    }

                                    var range=best[key]-worst[key];
                                    var percent=range<=0
                                        ?50
                                        :Math.round(
                                            (raw[key]-worst[key])/
                                            range*
                                            100
                                        );

                                    percent=Math.max(
                                        0,
                                        Math.min(100,percent)
                                    );

                                    output[key]={
                                        pct:percent,
                                        ev:evidence[key],
                                        tier:tierOf(percent)
                                    };
                                });

                                return output;
                            }

                            function ranked(scores){
                                return MET_ALL
                                    .filter(function(key){
                                        return scores[key].ev>0;
                                    })
                                    .sort(function(a,b){
                                        if(scores[b].pct!==scores[a].pct){
                                            return scores[b].pct-scores[a].pct;
                                        }

                                        return MET_ALL.indexOf(a)-
                                            MET_ALL.indexOf(b);
                                    });
                            }

                            function scrollTop(){
                                var reducedMotion=false;

                                try{
                                    reducedMotion=!!(
                                        window.matchMedia &&
                                        window.matchMedia(
                                            "(prefers-reduced-motion: reduce)"
                                        ).matches
                                    );
                                }catch(e){}

                                if(reducedMotion){
                                    try{window.scrollTo(0,0);}
                                    catch(e){}
                                    return;
                                }

                                try{
                                    window.scrollTo({
                                        top:0,
                                        left:0,
                                        behavior:"smooth"
                                    });
                                }catch(e){
                                    try{window.scrollTo(0,0);}
                                    catch(e2){}
                                }
                            }

                            function go(stage){
                                if(stage<0)stage=0;

                                }

                                S.stage=stage;
                                focusNext=true;
                                pendingFocus=null;

                                save();

                            /*
                             * Reliable navigation:
                             * The target is read when the learner clicks the button.
                             * It does not rely on an old closure or a previous render.
                             */
                            function safeAdvance(nextStage,requirement){
                                var target=parseInt(nextStage,10);

                                if(isNaN(target))return;

                                if(
                                    requirement==="next12" &&
                                    !filled(S.com.f,NEXT12.min)
                                ){
                                    say(
                                        "Write the next step you agreed with them before continuing."
                                    );

                                    var nextField=document.getElementById("next12");

                                    if(nextField){
                                        nextField.focus();
                                    }

                                    return;
                                }

                                if(!canMoveTo(target)){
                                    var incomplete=firstIncomplete();

                                    if(
                                        incomplete===12 &&
                                        S.ans[12]!==undefined
                                    ){
                                        say(
                                            "Write the next step you agreed with them before continuing."
                                        );

                                        var coachingField=
                                            document.getElementById("next12");

                                        if(coachingField){
                                            coachingField.focus();
                                        }

                                        return;
                                    }

                                    say(lockMsg(target));
                                    return;
                                }

                                S.stage=target;
                                focusNext=true;
                                pendingFocus=null;

                                save();
                                render();
                                scrollTop();
                            }

                            function bindStageNavigation(){
                                var stage=document.getElementById("stage");

                                if(!stage)return;

                                /*
                                 * Event delegation ensures a Next Scenario button works
                                 * after inactivity, re-renders, iframe focus changes,
                                 * and delayed course-player rendering.
                                 */
                                stage.addEventListener("click",function(event){
                                    var target=event.target;

                                    if(!target)return;

                                    var button=target.closest
                                        ?target.closest("[data-advance]")
                                        :null;

                                    if(!button)return;

                                    event.preventDefault();

                                    safeAdvance(
                                        button.getAttribute("data-advance"),
                                        button.getAttribute("data-requires")||""
                                    );
                                });
                            }

                            function optionList(
                                parent,
                                options,
                                selected,
                                onPick,
                                groupLabel,
                                groupId
                            ){
                                var box=el("div","ch");

                                box.id=groupId||"optGroup";

                                box.setAttribute("role","radiogroup");
                                box.setAttribute(
                                    "aria-label",
                                    groupLabel||"Choose one response"
                                );

                                var buttons=[];
                                var focusIndex=(
                                    selected===null||
                                    selected===undefined
                                )?0:selected;

                                options.forEach(function(option,index){
                                    var selectedNow=selected===index;

                                    var button=el(
                                        "button",
                                        "cb"+(selectedNow?" sel":""),
                                        (
                                            selectedNow
                                                ?"✓ "
                                                :""
                                        )+option.l
                                    );

                                    button.type="button";
                                    button.setAttribute("role","radio");

                                    button.setAttribute(
                                        "aria-checked",
                                        selectedNow?"true":"false"
                                    );

                                    button.tabIndex=(
                                        index===focusIndex
                                    )?0:-1;

                                    button.onclick=function(){
                                        onPick(index);
                                    };

                                    button.onkeydown=function(event){
                                        var key=event.key;
                                        var nextIndex=null;

                                        if(
                                            key==="ArrowDown"||
                                            key==="ArrowRight"
                                        ){
                                            nextIndex=(index+1)%options.length;
                                        }else if(
                                            key==="ArrowUp"||
                                            key==="ArrowLeft"
                                        ){
                                            nextIndex=(
                                                index-1+options.length
                                            )%options.length;
                                        }else if(key==="Home"){
                                            nextIndex=0;
                                        }else if(key==="End"){
                                            nextIndex=options.length-1;
                                        }else{
                                            return;
                                        }

                                        event.preventDefault();
                                        buttons[nextIndex].focus();
                                        onPick(nextIndex);
                                    };

                                    buttons.push(button);
                                    box.appendChild(button);
                                });

                                parent.appendChild(box);

                                return box;
                            }

                                label.textContent=tk(labelText);

                                parent.appendChild(label);

                                var hint=el("p","fh",hintText);

                                parent.appendChild(hint);

                                var field=document.createElement(
                                    multiline?"textarea":"input"
                                );

                                if(!multiline){
                                    field.type="text";
                                }

                                field.value=S.com[key];

                                field.setAttribute(
                                    "aria-describedby",
                                    hint.id
                                );

                                field.oninput=function(){
                                    S.com[key]=field.value;
                                    save();
                                };

                                parent.appendChild(field);
                            }

                            function sResults(parent){

                                            "Your strongest area this run was "

                                        el("b","",M[strongest].name)
                                    );

                                    headline.appendChild(
                                        document.createTextNode(
                                            ". The clearest place to build on is "
                                        )
                                    );

                                    headline.appendChild(
                                        el("b","",M[buildOn].name)
                                    );

                                    headline.appendChild(
                                        document.createTextNode(".")
                                    );

                                    headline.appendChild(
                                        document.createTextNode(
                                            "Replay a few decisions to build a fuller capability profile."
                                        )
                                    );
                                }

                                var profile=el("div","pfw");

                                profile.appendChild(
                                    el("h3","","Your capability profile")
                                );

                                    el(
                                        "div",
                                        "sc first",
                                        "Leader Expectations"

                                );

                                var leaders=el("div","mgrid b3");

                                G_LE.forEach(function(key){
                                    leaders.appendChild(
                                        meter(key,scores,true,true)
                                    );
                                });

                                profile.appendChild(leaders);

                                profile.appendChild(
                                    el(
                                        "div",
                                        "sc",
                                        "Guiding Principle skills"
                                    )
                                );

                                var principles=el("div","mgrid b3");

                                G_GP.forEach(function(key){
                                    principles.appendChild(
                                        meter(key,scores,true,true)
                                    );
                                });

                                profile.appendChild(principles);

                                profile.appendChild(
                                    el(
                                        "div",
                                        "sc",
                                        "Further leadership skills"
                                    )
                                );

                                var leadership=el("div","mgrid b3");

                                G_LS.forEach(function(key){
                                    leadership.appendChild(
                                        meter(key,scores,true,true)
                                    );
                                });

                                profile.appendChild(leadership);
                                parent.appendChild(profile);

                                var config=CB[buildOn]||CB.rel;

                                var commitments=el("div","cm");

                                commitments.appendChild(
                                    el("h3","","Your commitments")
                                );

                                commitments.appendChild(
                                    el(
                                        "p",
                                        "",
                                        "Turn your choices into observable real-work actions."
                                    )
                                );

                                if(buildOn){
                                    commitments.appendChild(
                                        el(
                                            "p",
                                            "",
                                            "Your first commitment is built from the capability you can strengthen next: "+
                                            M[buildOn].name+
                                            "."
                                        )
                                    );
                                }

                                var firstFieldset=document.createElement(
                                    "fieldset"
                                );

                                var firstLegend=document.createElement("legend");

                                firstLegend.textContent=tk(config.lg);

                                firstFieldset.appendChild(firstLegend);

                                inputField(
                                    firstFieldset,
                                    "cA",
                                    config.q,
                                    config.h,
                                    true,
                                    "a"
                                );

                                inputField(
                                    firstFieldset,
                                    "cB",
                                    "When will you do it?",
                                    "Be specific. For example, Tuesday's one-to-one or the next {rv}.",
                                    false,
                                    "b"
                                );

                                inputField(
                                    firstFieldset,
                                    "cC",
                                    config.q2,
                                    config.h2,
                                    true,
                                    "c"
                                );

                                commitments.appendChild(firstFieldset);

                                var secondFieldset=document.createElement(
                                    "fieldset"
                                );

                                var secondLegend=document.createElement(
                                    "legend"
                                );

                                secondLegend.textContent=
                                    "Coaching in the flow of work";

                                secondFieldset.appendChild(secondLegend);

                                inputField(
                                    secondFieldset,
                                    "cD",
                                    "One coaching moment you will take instead of fixing it yourself",
                                    "For example, ask what they think the {cl} cared about before suggesting a revision.",
                                    true,
                                    "d"
                                );

                                inputField(
                                    secondFieldset,
                                    "cE",
                                    "Where will it happen?",
                                    "For example, in the next {rv}, project check-in, or one-to-one.",
                                    true,
                                    "e"
                                );

                                if(filled(S.com.f,1)){
                                    secondFieldset.appendChild(
                                        el(
                                            "p",
                                            "fh",
                                            "The next step you agreed in the coaching moment: “"+
                                            S.com.f.trim()+
                                            "”"
                                        )
                                    );
                                }

                                commitments.appendChild(secondFieldset);

                                var challenge=el("div","pchallenge");

                                challenge.appendChild(
                                    el("b","","The Pacesetter Challenge")
                                );

                                challenge.appendChild(
                                    el(
                                        "p",
                                        "",
                                        "Pacesetters do not build habits in secret. Add this commitment to the agenda for your next one-to-one with your manager or a peer. Discuss one trade-off you made today."
                                    )
                                );

                                commitments.appendChild(challenge);

                                var actions=el("div","ca");

                                var printButton=el(
                                    "button",
                                    "gh",
                                    "Print / Save as PDF"
                                );
