                                printButton.onclick=function(){
                                    window.print();
                                };

                                actions.appendChild(printButton);
                                commitments.appendChild(actions);
                                parent.appendChild(commitments);

                                var restartWrap=el("div","rw");

                                var restart=el(
                                    "button",
                                    "bk",
                                    "Restart the scenario"
                                );

                                restart.type="button";

                                var armed=false;

                                restart.onclick=function(){
                                    if(!armed){
                                        armed=true;

                                        restart.className="bk gh arm";

                                        restart.textContent=
                                            "Confirm restart — this clears your commitments";

                                        say(
                                            "Press again to restart. This clears everything you have typed."
                                        );

                                        setTimeout(function(){
                                            if(!armed)return;

                                            armed=false;
                                            restart.className="bk";

                                            restart.textContent=
                                                "Restart the scenario";
                                        },6000);

                                        return;
                                    }

                                    S=fresh();
                                    save();

                                    focusNext=true;
                                    pendingFocus=null;

                                    render();
                                };

                                restartWrap.appendChild(restart);
                                parent.appendChild(restartWrap);

                                fillBars(parent);
                            }

                            function stepper(){
                                var list=document.getElementById("stepper");
                                var select=document.getElementById("stageSel");

                                if(!list||!select)return;

                                list.innerHTML="";
                                select.innerHTML="";

                                STAGES.forEach(function(label,index){
                                    var open=canMoveTo(index);
                                    var completed=isDone(index)&&
                                        index<S.stage;

                                    var current=index===S.stage;

                                    var item=document.createElement("li");
                                    var classes=[];

                                    if(completed)classes.push("dn");
                                    if(current)classes.push("cu");
                                    if(!open)classes.push("lk");

                                    item.className=classes.join(" ");

                                    var button=document.createElement("button");

                                    button.type="button";

                                    var status=!open
                                        ?". Locked. "+lockMsg(index)
                                        :(
                                            completed
                                                ?". Completed."
                                                :(
                                                    current
                                                        ?". Current section."
                                                        :""
                                                )
                                        );

                                    button.setAttribute(
                                        "aria-label",
                                        label+
                                        ". Section "+
                                        (index+1)+
                                        " of "+
                                        STAGES.length+
                                        status
                                    );

                                    if(current){
                                        button.setAttribute(
                                            "aria-current",
                                            "step"
                                        );
                                    }

                                    if(!open){
                                        button.setAttribute(
                                            "aria-disabled",
                                            "true"
                                        );
                                    }

                                    button.appendChild(
                                        el("span","sb","")
                                    );

                                    var pair=TAB_LABELS[index]||[
                                        label,
                                        ""
                                    ];

                                    var wrap=el("span","tlab","");
                                    var lineOne=el("span","tln","");
                                    var icon=el("span","tgl","");

                                    icon.textContent=!open
                                        ?"🔒"
                                        :(completed?"✓":" ");

                                    icon.setAttribute(
                                        "aria-hidden",
                                        "true"
                                    );

                                    lineOne.appendChild(icon);

                                    lineOne.appendChild(
                                        document.createTextNode(pair[0])
                                    );

                                    wrap.appendChild(lineOne);

                                    var secondLine=pair[1]||"";

                                    var lineTwo=el(
                                        "span",
                                        "tln"+(
                                            secondLine
                                                ?""
                                                :" e"
                                        ),
                                        ""
                                    );

                                    lineTwo.textContent=secondLine||" ";

                                    wrap.appendChild(lineTwo);
                                    button.appendChild(wrap);

                                    button.onclick=open
                                        ?function(){go(index);}
                                        :function(){say(lockMsg(index));};

                                    item.appendChild(button);
                                    list.appendChild(item);

                                    var option=document.createElement("option");

                                    option.value=String(index);

                                    option.textContent=
                                        (index+1)+
                                        ". "+
                                        label+
                                        (
                                            !open
                                                ?" (locked)"
                                                :(completed?" ✓":"")
                                        );

                                    option.disabled=!open;

                                    if(current){
                                        option.selected=true;
                                    }

                                    select.appendChild(option);
                                });

                                select.onchange=function(){
                                    go(parseInt(select.value,10));
                                };
                            }

                            function render(){
                                var stage=document.getElementById("stage");

                                if(!stage)return;

                                if(!canMoveTo(S.stage)){
                                    S.stage=firstIncomplete();
                                }

                                stage.innerHTML="";

                                var heading=el(
                                    "h2",
                                    "vh",
                                    STAGES[S.stage]||STAGES[0]
                                );

                                heading.id="stageHeading";
                                heading.tabIndex=-1;

                                stage.appendChild(heading);

                                /*
                                 * Adds the connected narrative at the beginning of
                                 * every scenario and reflective stage.
                                 */
                                storyBridge(stage,S.stage);

                                switch(S.stage){
                                    case 0:
                                        sRole(stage);
                                        break;

                                    case 1:
                                        sStart(stage);
                                        break;

                                    case 2:
                                        sPattern(stage);
                                        break;

                                    case 3:
                                    case 4:
                                    case 5:
                                    case 6:
                                    case 11:
                                    case 12:
                                    case 13:
                                        sDecision(stage,S.stage);
                                        break;

                                    case 7:
                                        sBridge(stage);
                                        break;

                                    case 8:
                                        sSignals(stage);
                                        break;

                                    case 9:
                                        sRecap(stage);
                                        break;

                                    case 10:
                                        sIntro(stage);
                                        break;

                                    case 14:
                                        sRefl(stage);
                                        break;

                                    case 15:
                                        sResults(stage);
                                        break;

                                    default:
                                        S.stage=0;
                                        sRole(stage);
                                }

                                stepper();
                                save();

                                if(pendingFocus){
                                    var target=document.getElementById(
                                        pendingFocus
                                    );

                                    if(target){
                                        try{target.focus();}
                                        catch(e){}

                                        if(
                                            target.getAttribute &&
                                            target.getAttribute("role")==="radiogroup"
                                        ){
                                            var focusable=target.querySelector(
                                                '[tabindex="0"]'
                                            )||target.querySelector("button");

                                            if(focusable){
                                                try{focusable.focus();}
                                                catch(e){}
                                            }
                                        }

                                        if(
                                            (
                                                pendingFocus==="next12"||
                                                pendingFocus==="auth5"
                                            )&&
                                            target.setSelectionRange
                                        ){
                                            try{
                                                target.setSelectionRange(
                                                    target.value.length,
                                                    target.value.length
                                                );
                                            }catch(e){}
                                        }
                                    }else if(focusNext){
                                        heading.focus();
                                    }

                                    pendingFocus=null;
                                }else if(focusNext){
                                    heading.focus();
                                }

                                focusNext=true;
                            }

                            (function(){
                                var button=document.getElementById("fsBtn");
                                var app=document.getElementById("app");

                                function updateLabel(){
                                    var fullscreen=
                                        document.fullscreenElement||
                                        document.webkitFullscreenElement;

                                    button.textContent=(
                                        fullscreen||
                                        app.classList.contains("fm")
                                    )
                                        ?"Exit full screen"
                                        :"Full screen";

                                    button.setAttribute(
                                        "aria-pressed",
                                        (
                                            fullscreen||
                                            app.classList.contains("fm")
                                        )
                                            ?"true"
                                            :"false"
                                    );
                                }

                                function focusMode(on){
                                    app.classList.toggle("fm",on);
                                    updateLabel();

                                    say(
                                        on
                                            ?"Focus mode on. The activity now uses the full embed area."
                                            :"Focus mode off."
                                    );
                                }

                                button.setAttribute("aria-pressed","false");

                                button.onclick=function(){
                                    var fullscreen=
                                        document.fullscreenElement||
                                        document.webkitFullscreenElement;

                                    if(fullscreen){
                                        try{
                                            (
                                                document.exitFullscreen||
                                                document.webkitExitFullscreen
                                            ).call(document);
                                        }catch(e){}

                                        updateLabel();
                                        return;
                                    }

                                    if(app.classList.contains("fm")){
                                        focusMode(false);
                                        return;
                                    }

                                    var request=
                                        app.requestFullscreen||
                                        app.webkitRequestFullscreen;

                                    if(!request){
                                        focusMode(true);
                                        return;
                                    }

                                    try{
                                        var result=request.call(app);

                                        if(result&&result.then){
                                            result.then(
                                                updateLabel,
                                                function(){
                                                    focusMode(true);
                                                }
                                            );
                                        }else{
                                            setTimeout(updateLabel,120);
                                        }
                                    }catch(e){
                                        focusMode(true);
                                    }
                                };

                                document.addEventListener(
                                    "fullscreenchange",
                                    updateLabel
                                );

                                document.addEventListener(
                                    "webkitfullscreenchange",
                                    updateLabel
                                );
                            })();

                            S=load()||fresh();

                            /*
                             * Bind this once. It handles every feedback-card
                             * Next Scenario button, including buttons generated
                             * after future renders.
                             */
                            bindStageNavigation();

                            render();

                        }catch(error){
                            try{
                                var errorBox=document.createElement("div");
                                errorBox.className="errbox";

                                var errorHeading=document.createElement("h2");

                                errorHeading.textContent=
                                    "This activity hit an error during setup. Screenshot this box.";

                                errorBox.appendChild(errorHeading);

                                errorBox.appendChild(
                                    document.createTextNode(
                                        (
                                            error&&error.message
                                                ?error.message
                                                :String(error)
                                        )+
                                        (
                                            error&&error.stack
                                                ?"\n\nStack:\n"+error.stack
                                                :""
                                        )
                                    )
                                );

                                var host=document.getElementById("stage")||
                                    document.body;

                                host.insertBefore(
                                    errorBox,
                                    host.firstChild
                                );
                            }catch(e2){}
                        }
                    })();
        </script>
    </body>
